apiVersion: v1
kind: ServiceAccount
metadata:
  name: reloader
  namespace: kubesphere-reloader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesphere-reloader
rules:
  - apiGroups: ['']
    resources: [configmaps, secrets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch, patch, update]
  # A separate rule on purpose: adding `events` to the rule above would force its
  # verbs to be the union, which would grant create/patch on configmaps and secrets.
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubesphere-reloader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubesphere-reloader
subjects:
  - kind: ServiceAccount
    name: reloader
    namespace: kubesphere-reloader
