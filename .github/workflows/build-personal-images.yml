name: Build Personal Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish images
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mingys
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish ks-apiserver
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/ks-apiserver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/mingys/ks-apiserver:${{ env.IMAGE_TAG }}
            ghcr.io/mysstack/ks-apiserver:${{ env.IMAGE_TAG }}

      - name: Build and publish ks-controller-manager
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/ks-controller-manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/mingys/ks-controller-manager:${{ env.IMAGE_TAG }}
            ghcr.io/mysstack/ks-controller-manager:${{ env.IMAGE_TAG }}
