name: Build Personal Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git branch, tag, or commit SHA to build
        required: true
        default: master
        type: string
      tag:
        description: Image tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ks-apiserver
            dockerfile: build/ks-apiserver/Dockerfile
          - image: ks-controller-manager
            dockerfile: build/ks-controller-manager/Dockerfile
    env:
      IMAGE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mingys
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/mingys/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ghcr.io/mysstack/${{ matrix.image }}:${{ env.IMAGE_TAG }}
