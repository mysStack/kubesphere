name: Build Personal Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional branch, tag, or commit SHA; defaults to the branch selected in Actions
        required: false
        type: string
      tag:
        description: Base image tag (defaults to oci-repo for test builds)
        required: false
        default: oci-repo
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Generate image tag
        id: image_tag
        env:
          BASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "value=${BASE_TAG}-$(TZ=Asia/Shanghai date +%Y%m%d)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mingys
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish ks-apiserver
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/ks-apiserver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/mingys/ks-apiserver:${{ steps.image_tag.outputs.value }}
            ghcr.io/mysstack/ks-apiserver:${{ steps.image_tag.outputs.value }}

      - name: Build and publish ks-controller-manager
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/ks-controller-manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/mingys/ks-controller-manager:${{ steps.image_tag.outputs.value }}
            ghcr.io/mysstack/ks-controller-manager:${{ steps.image_tag.outputs.value }}
