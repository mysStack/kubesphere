name: Build Personal Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional branch, tag, or commit SHA; defaults to the branch selected in Actions
        required: false
        type: string
      tag:
        description: Optional image tag prefix; defaults to the source branch name
        required: false
        type: string
      image:
        description: Image to build
        required: true
        default: ks-controller-manager
        type: choice
        options:
          - ks-controller-manager
          - ks-apiserver
          - all

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ks-apiserver
            dockerfile: build/ks-apiserver/Dockerfile
          - image: ks-controller-manager
            dockerfile: build/ks-controller-manager/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          # The Go build derives GitVersion from the nearest v* tag.
          # A shallow checkout omits that history and leaves it as v0.0.0.
          fetch-depth: 0

      - name: Generate image tag
        id: image_tag
        env:
          BASE_TAG: ${{ inputs.tag || inputs.source_ref || github.ref_name }}
        run: |
          NORMALIZED_TAG=$(printf '%s' "$BASE_TAG" | tr '/:@' '-')
          echo "value=${NORMALIZED_TAG}-$(TZ=Asia/Shanghai date +%Y%m%d)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mingys
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/mingys/${{ matrix.image }}:${{ steps.image_tag.outputs.value }}
            ghcr.io/mysstack/${{ matrix.image }}:${{ steps.image_tag.outputs.value }}
