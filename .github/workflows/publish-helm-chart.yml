name: Publish Helm Chart

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Only a stable release tag such as v4.1.4 publishes the Chart.
    # RC, OCI test, and other suffixed tags remain build-only.
    if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-')
    name: Package and publish ks-core
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.1

      - name: Read and validate Chart metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          chart_version="$(helm show chart ./config/ks-core | sed -n 's/^version: //p' | head -n 1)"
          app_version="$(helm show chart ./config/ks-core | sed -n 's/^appVersion: //p' | head -n 1)"
          expected_app_version="${RELEASE_TAG}"
          if [[ "${app_version}" != "${expected_app_version}" ]]; then
            echo "Chart appVersion ${app_version} does not match release tag ${expected_app_version}" >&2
            exit 1
          fi
          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"

      - name: Lint and package Chart
        env:
          CHART_VERSION: ${{ steps.metadata.outputs.chart_version }}
        run: |
          helm lint ./config/ks-core --namespace kubesphere-system
          mkdir -p dist
          helm package ./config/ks-core --destination dist
          test -f "dist/ks-core-${CHART_VERSION}.tgz"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | helm registry login docker.io --username mingys --password-stdin

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push Chart to Docker Hub and GHCR
        env:
          CHART_VERSION: ${{ steps.metadata.outputs.chart_version }}
        run: |
          chart="dist/ks-core-${CHART_VERSION}.tgz"
          helm push "$chart" oci://docker.io/mingys
          helm push "$chart" oci://ghcr.io/mysstack
